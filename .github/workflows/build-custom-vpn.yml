name: Build Custom VPN with Auto-Config

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Название приложения'
        required: true
        default: 'Xquestion VPN'
      logo_url:
        description: 'Путь к логотипу (logo.png или https://...)'
        required: true
        default: 'logo.png'
      api_endpoint:
        description: 'API endpoint'
        required: true
        default: 'http://195.19.153.74:4001/api/v1/request/awg/'
      api_key:
        description: 'API key'
        required: true
        default: '9728d7339e07a64f88a9ec22285e06499be36d61f3416503496fa1267c44fde6'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Amnezia Client
        uses: actions/checkout@v4
        with:
          repository: amnezia-vpn/amnezia-client
          submodules: recursive
          fetch-depth: 1
          path: amnezia-client
      
      - name: Checkout Custom Files
        uses: actions/checkout@v4
        with:
          path: custom_files
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libgl1-mesa-dev \
            libxcb-util1 \
            libxcb-util-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-shape0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libglib2.0-dev \
            libpulse-dev \
            libsqlite3-dev \
            imagemagick \
            git \
            wget \
            openjdk-11-jdk \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-tools-dev \
            qt6-l10n-tools
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-33 build-tools;33.0.2 ndk;25.2.9519653'
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Install Gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      
      - name: Replace App Name
        run: |
          cd amnezia-client
          find . -name "strings.xml" -path "*/android-app/*" -exec sed -i 's/Amnezia VPN/${{ github.event.inputs.app_name }}/g' {} \;
          find . -name "strings.xml" -path "*/values-ru/*" -exec sed -i 's/Amnezia VPN/${{ github.event.inputs.app_name }}/g' {} \; 2>/dev/null || true
      
      - name: Replace Icons
        run: |
          LOGO_SOURCE="${{ github.event.inputs.logo_url }}"
          
          if [[ "$LOGO_SOURCE" == http* ]]; then
            wget -O logo.png "$LOGO_SOURCE"
          elif [ -f "custom_files/$LOGO_SOURCE" ]; then
            cp "custom_files/$LOGO_SOURCE" logo.png
          elif [ -f "custom_files/logo.png" ]; then
            cp "custom_files/logo.png" logo.png
          else
            echo "ERROR: Logo not found"
            ls -la custom_files/
            exit 1
          fi
          
          cd amnezia-client
          for dir in $(find . -type d -name "mipmap-*" -path "*/android-app/*"); do
            size=48
            [[ "$dir" == *"hdpi"* ]] && size=72
            [[ "$dir" == *"xhdpi"* ]] && size=96
            [[ "$dir" == *"xxhdpi"* ]] && size=144
            [[ "$dir" == *"xxxhdpi"* ]] && size=192
            convert ../logo.png -resize ${size}x${size} "$dir/ic_launcher.png" 2>/dev/null || true
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png" 2>/dev/null || true
          done
      
      - name: Add Auto-Config Feature
        run: |
          cd amnezia-client
          CORE_DIR=$(find . -type d -name "core" -path "*/client/*" | head -1)
          if [ -n "$CORE_DIR" ]; then
            mkdir -p "$CORE_DIR/api"
            
            cat > "$CORE_DIR/api/auto_config.cpp" << 'EOF'
          #include <QNetworkAccessManager>
          #include <QNetworkReply>
          #include <QJsonDocument>
          #include <QJsonObject>
          #include <QSettings>
          #include <QEventLoop>
          #include <QDebug>
          
          void autoFetchConfig() {
              QSettings settings;
              if (settings.value("configured", false).toBool()) return;
              
              QString apiEndpoint = "${{ github.event.inputs.api_endpoint }}";
              QString apiKey = "${{ github.event.inputs.api_key }}";
              
              QNetworkAccessManager mgr;
              QUrl url(apiEndpoint);
              QNetworkRequest req(url);
              req.setHeader(QNetworkRequest::ContentTypeHeader, "application/json");
              req.setRawHeader("x-api-key", apiKey.toUtf8());
              
              QJsonObject payload;
              payload["public_key"] = "auto";
              
              QEventLoop loop;
              QNetworkReply *reply = mgr.post(req, QJsonDocument(payload).toJson());
              QObject::connect(reply, &QNetworkReply::finished, &loop, &QEventLoop::quit);
              loop.exec();
              
              if (reply->error() == QNetworkReply::NoError) {
                  QByteArray data = reply->readAll();
                  settings.setValue("config", data);
                  settings.setValue("configured", true);
                  qDebug() << "Auto-config loaded successfully from:" << apiEndpoint;
              } else {
                  qDebug() << "Auto-config failed:" << reply->errorString();
              }
              reply->deleteLater();
          }
          EOF
            
            echo "Auto-config feature added"
          fi
      
      - name: Build APK
        run: |
          cd amnezia-client
          mkdir -p build && cd build
          
          export ANDROID_HOME=/usr/local/lib/android/sdk
          
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/25.2.9519653/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-33
          
          if [ $? -ne 0 ]; then
            echo "CMake configuration failed"
            exit 1
          fi
          
          cmake --build . --target apk -- -j2
          
          if [ $? -ne 0 ]; then
            echo "Build failed"
            exit 1
          fi
      
      - name: Find APK
        run: |
          echo "Searching for APK..."
          find amnezia-client/build -name "*.apk" -type f
          APK_PATH=$(find amnezia-client/build -name "*.apk" -type f | grep -v "unaligned" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" ./app.apk
            echo "APK found: $APK_PATH"
          else
            echo "No APK found"
          fi
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-VPN
          path: ./app.apk
          retention-days: 30
