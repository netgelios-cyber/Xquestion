name: Build Custom VPN with Auto-Config

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Название приложения'
        required: true
        default: 'My VPN'
      logo_url:
        description: 'Ссылка на логотип (PNG)'
        required: true
      api_endpoint:
        description: 'API endpoint'
        required: true
        default: 'http://195.19.153.74:4001/api/v1/request/awg/'
      api_key:
        description: 'API key'
        required: true
        default: '9728d7339e07a64f88a9ec22285e06499be36d61f3416503496fa1267c44fde6'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: amnezia-vpn/amnezia-client
          submodules: recursive
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
      
      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.2'
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qt5compat qtimageformats qtmultimedia qtremoteobjects qtshadertools'
          dir: '${{ github.workspace }}/qt'
          install-deps: 'true'
          cache: 'true'
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Install Gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
      
      - name: Replace App Name
        run: |
          find . -name "strings.xml" -path "*/android-app/*" -exec sed -i 's/Amnezia VPN/${{ github.event.inputs.app_name }}/g' {} \;
      
      - name: Replace Icons
        run: |
          wget -O logo.png "${{ github.event.inputs.logo_url }}"
          for dir in $(find . -type d -name "mipmap-*" -path "*/android-app/*"); do
            size=48
            [[ "$dir" == *"hdpi"* ]] && size=72
            [[ "$dir" == *"xhdpi"* ]] && size=96
            [[ "$dir" == *"xxhdpi"* ]] && size=144
            [[ "$dir" == *"xxxhdpi"* ]] && size=192
            convert logo.png -resize ${size}x${size} "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png" 2>/dev/null || true
          done
      
      - name: Add Auto-Config
        run: |
          CORE_DIR=$(find . -type d -name "core" -path "*/client/*" | head -1)
          if [ -n "$CORE_DIR" ]; then
            mkdir -p "$CORE_DIR/api"
            cat > "$CORE_DIR/api/auto_config.cpp" << EOF
          #include <QNetworkAccessManager>
          #include <QNetworkReply>
          #include <QJsonDocument>
          #include <QSettings>
          
          void autoFetchConfig() {
              QSettings settings;
              if (settings.value("configured", false).toBool()) return;
              
              QNetworkAccessManager mgr;
              QUrl url("${{ github.event.inputs.api_endpoint }}");
              QNetworkRequest req(url);
              req.setRawHeader("x-api-key", "${{ github.event.inputs.api_key }}");
              
              QEventLoop loop;
              QNetworkReply *reply = mgr.post(req, "{}");
              QObject::connect(reply, &QNetworkReply::finished, &loop, &QEventLoop::quit);
              loop.exec();
              
              if (reply->error() == QNetworkReply::NoError) {
                  QByteArray data = reply->readAll();
                  settings.setValue("config", data);
                  settings.setValue("configured", true);
              }
              reply->deleteLater();
          }
          EOF
          fi
      
      - name: Build APK
        run: |
          mkdir build && cd build
          export QT_ROOT_DIR=${{ github.workspace }}/qt/6.6.2/android_arm64_v8a
          cmake .. -DCMAKE_BUILD_TYPE=Release -DQT_HOST_PATH=${{ github.workspace }}/qt/6.6.2/gcc_64
          cmake --build . --target apk -j2
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}
          path: build/*.apk
